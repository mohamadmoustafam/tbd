<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For Tasnim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Amiri:ital@0;1&family=Caveat:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="onCover">
    <main id="book">
      <section
        class="pg covr"
        id="cover"
        tabindex="0"
        role="button"
        aria-label="Open your gift"
      >
        <div class="gift" aria-hidden="true">
          <div class="glow"></div>
          <div class="lid">
            <i class="bow l"></i><i class="bow r"></i><i class="knot"></i>
          </div>
          <div class="box"></div>
        </div>
        <p class="hand">A gift, wrapped in memories</p>
        <h1>For Tasnim</h1>
        <p class="ar" dir="rtl" lang="ar">كل عام وأنتِ بخير</p>
        <small>Tap to open your gift &middot; اضغطي لفتح الهدية</small>
      </section>
    </main>
    <div id="count" aria-live="polite"></div>
    <div id="hint" hidden>
      Swipe to turn the page &middot; اسحبي لقلب الصفحة
    </div>
    <button id="snd" aria-label="Sound on" aria-pressed="true">&#9835;</button>
    <div
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
      hidden
    >
      <button id="close" aria-label="Close photo">&times;</button>
      <img alt="" />
      <p></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
